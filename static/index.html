<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f4">
  <title>Revisio | Ask, think, explore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <style>
    :root { --ink: #242d29; --muted: #737c77; --line: #e2e6df; --paper: #f6f7f4; --green: #27634b; --soft-green: #e7eee6; --white: #fff; --red: #a63e44; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font: 14px 'DM Sans', sans-serif; letter-spacing: 0; }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--green); outline-offset: 4px; }
    button svg { width: 18px; height: 18px; flex-shrink: 0; }
    .app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100dvh; }
    .sidebar { display: flex; flex-direction: column; padding: 32px 22px 22px; background: #eef0eb; border-right: 1px solid var(--line); position: sticky; top: 0; height: 100dvh; }
    .brand { display: flex; gap: 10px; align-items: center; font: 600 26px 'Space Grotesk', sans-serif; }
    .brand-mark { width: 32px; height: 32px; display: grid; place-items: center; color: var(--green); }
    .brand-mark svg { width: 30px; height: 30px; }
    .edition { margin: 9px 0 42px 42px; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.8px; }
    .new-chat { display: flex; gap: 10px; align-items: center; justify-content: center; min-height: 43px; border: 1px solid #d6ddd3; border-radius: 6px; background: var(--white); font-weight: 600; color: var(--ink); }
    .section-label { color: var(--muted); text-transform: uppercase; letter-spacing: 1.6px; font-size: 10px; font-weight: 600; margin: 32px 10px 12px; }
    .active-chat { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 5px; background: #dde6dc; color: #355342; }
    .active-chat svg { width: 16px; height: 16px; flex-shrink: 0; }
    #chat-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sidebar-bottom { margin-top: auto; padding-top: 24px; }
    .workspace { border-top: 1px solid #dce1d8; padding-top: 20px; display: flex; gap: 11px; align-items: center; }
    .workspace-icon { background: #e2e6de; border: 1px solid #d7ddcf; width: 34px; height: 34px; border-radius: 6px; display: grid; place-items: center; font: 600 14px 'Space Grotesk', sans-serif; }
    .workspace strong { display: block; font-size: 12px; font-weight: 600; }
    .workspace small { color: var(--muted); font-size: 11px; }
    main { min-width: 0; display: flex; flex-direction: column; height: 100dvh; }
    header { height: 78px; padding: 0 38px; flex-shrink: 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; background: #fafbf8; gap: 12px; }
    .breadcrumb { display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--muted); }
    .breadcrumb strong { color: var(--ink); font-weight: 550; }
    .slash { color: #bdc4bc; }
    .connection { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #b6bdb4; flex-shrink: 0; }
    .dot.ready { background: #438565; }
    .dot.missing { background: #bb8540; }
    .mobile-new { display: none; }
    .scroll-area { overflow-y: auto; min-height: 0; flex: 1; padding: 36px 32px; scrollbar-gutter: stable; }
    .welcome { max-width: 760px; margin: max(28px, calc((100dvh - 720px) / 3)) auto 0; animation: appear .5s ease both; }
    .eyebrow { color: var(--green); display: flex; align-items: center; gap: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 650; }
    .eyebrow svg { width: 16px; height: 16px; }
    h1 { font: 500 46px/1.14 'Space Grotesk', sans-serif; margin: 22px 0 16px; letter-spacing: 0; }
    h1 span { color: var(--green); }
    .greeting { color: var(--muted); font-size: 15px; line-height: 1.7; margin: 0; }
    .suggestions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 42px 0 18px; }
    .suggestion { border: 1px solid var(--line); background: #fcfdfa; padding: 20px 18px 16px; border-radius: 6px; text-align: left; min-height: 156px; display: flex; flex-direction: column; align-items: flex-start; color: var(--ink); transition: border-color .2s, background .2s; }
    .suggestion:hover { border-color: #9faf9c; background: white; }
    .suggestion .suggestion-icon { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 5px; margin-bottom: 17px; background: #e6ede3; color: #44704c; }
    .suggestion:nth-child(2) .suggestion-icon { color: #a65c44; background: #f3e8e1; }
    .suggestion:nth-child(3) .suggestion-icon { color: #546da0; background: #e7ecf6; }
    .suggestion strong { font-weight: 600; font-size: 12px; margin-bottom: 7px; }
    .suggestion span:last-child { color: var(--muted); font-size: 12px; line-height: 1.55; }
    .conversation { max-width: 760px; margin: 0 auto; }
    .message { display: flex; gap: 15px; padding: 20px 0 26px; animation: appear .2s ease both; }
    .avatar { width: 30px; height: 30px; flex-shrink: 0; border-radius: 5px; display: grid; place-items: center; font: 600 11px 'Space Grotesk', sans-serif; background: #e5e9e1; color: #5c6958; }
    .avatar.assistant { background: var(--green); color: white; }
    .avatar svg { width: 19px; height: 19px; }
    .message-main { flex: 1; min-width: 0; }
    .message-name { font-size: 12px; font-weight: 650; padding: 6px 0 11px; }
    .message-text { font-size: 14px; line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere; }
    .message.user { border-bottom: 1px solid var(--line); }
    .pending { color: var(--muted); animation: pulse 1.3s ease-in-out infinite; }
    .composer-area { padding: 8px 32px 20px; background: var(--paper); flex-shrink: 0; }
    .composer-wrap { max-width: 760px; margin: 0 auto; }
    .error { background: #fcf0ef; border: 1px solid #ebd0cd; color: var(--red); border-radius: 6px; padding: 12px 14px; line-height: 1.5; font-size: 12px; margin-bottom: 12px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
    .error button { background: transparent; color: var(--red); border: 0; text-decoration: underline; padding: 4px; flex-shrink: 0; }
    .composer { background: white; border: 1px solid #d7ddd1; border-radius: 8px; box-shadow: 0 4px 18px #283b2310; padding: 17px 17px 13px; }
    .composer:focus-within { border-color: #93aa8c; box-shadow: 0 0 0 3px #27634b08; }
    textarea { display: block; width: 100%; height: 60px; max-height: 160px; resize: none; border: none; background: transparent; color: var(--ink); font-size: 14px; line-height: 1.6; outline: none; padding: 0; }
    textarea::placeholder { color: #929a91; }
    .composer-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .model { font-size: 10px; color: var(--muted); display: flex; gap: 6px; align-items: center; overflow-wrap: anywhere; }
    .model svg { width: 13px; height: 13px; flex-shrink: 0; }
    .send { background: var(--green); color: white; display: grid; place-items: center; width: 34px; height: 34px; flex-shrink: 0; border: none; border-radius: 5px; }
    .send:hover:not(:disabled) { background: #1c4d39; }
    .footnote { text-align: center; color: #8d958b; font-size: 10px; margin: 13px 0 0; }
    [hidden] { display: none !important; }
    @keyframes appear { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 50% { opacity: .4; } }
    @media (min-width: 1500px) { .welcome, .conversation, .composer-wrap { max-width: 850px; } }
    @media (max-width: 900px) { .app { grid-template-columns: 200px minmax(0, 1fr); } .sidebar { padding: 26px 15px 20px; } header { padding: 0 24px; } .scroll-area { padding: 30px 24px; } .suggestions { gap: 8px; } .suggestion { padding: 15px 12px; } h1 { font-size: 38px; } }
    @media (max-width: 640px) { .app { display: block; } .sidebar { display: none; } header { height: 64px; padding: 0 18px; } .breadcrumb { gap: 8px; } .breadcrumb > span:first-child, .slash { display: none; } .connection { margin-left: auto; font-size: 10px; } .mobile-new { display: grid; place-items: center; background: none; border: 1px solid var(--line); border-radius: 5px; width: 32px; height: 32px; color: var(--ink); } .scroll-area { padding: 24px 20px; } .welcome { margin-top: 22px; } h1 { font-size: 34px; } .greeting { font-size: 13px; } .suggestions { grid-template-columns: 1fr; gap: 8px; margin-top: 28px; } .suggestion { min-height: 0; padding: 14px; display: grid; grid-template-columns: 30px minmax(0, 1fr); column-gap: 12px; } .suggestion .suggestion-icon { grid-row: span 2; margin: 0; align-self: center; } .suggestion strong { margin: 0 0 3px; } .suggestion span:last-child { font-size: 11px; } .composer-area { padding: 8px 16px 16px; } .composer { padding: 13px; } textarea { height: 48px; } .message { gap: 11px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Chat navigation">
      <div class="brand"><span class="brand-mark"><i data-lucide="asterisk"></i></span>revisio</div>
      <div class="edition">A little more clarity</div>
      <button class="new-chat" type="button"><i data-lucide="plus"></i>New chat</button>
      <div class="section-label">Your conversation</div>
      <div class="active-chat"><i data-lucide="message-square"></i><span id="chat-title">A fresh start</span></div>
      <div class="sidebar-bottom">
        <div class="workspace"><div class="workspace-icon">R</div><div><strong>Personal workspace</strong><small>Powered by OpenAI</small></div></div>
      </div>
    </aside>
    <main>
      <header>
        <div class="breadcrumb"><span>Workspace</span><span class="slash">/</span><strong>Revisio Chat</strong></div>
        <div class="connection" role="status"><span class="dot" id="status-dot"></span><span id="status-label">Connecting</span></div>
        <button class="mobile-new new-chat" type="button" title="New chat" aria-label="New chat"><i data-lucide="square-pen"></i></button>
      </header>
      <div class="scroll-area" id="scroll-area">
        <section class="welcome" id="welcome">
          <div class="eyebrow"><i data-lucide="sparkles"></i>A space for your next idea</div>
          <h1>A good question.<br><span>A new perspective.</span></h1>
          <p class="greeting">What are we thinking about today?</p>
          <div class="suggestions">
            <button type="button" class="suggestion" data-prompt="Explain a complex topic simply. Let's start with how large language models work."><span class="suggestion-icon"><i data-lucide="lightbulb"></i></span><strong>Make it make sense</strong><span>Untangle a complicated topic</span></button>
            <button type="button" class="suggestion" data-prompt="Help me write a thoughtful, concise email. Ask me who it's for and what I'd like to say."><span class="suggestion-icon"><i data-lucide="pen-line"></i></span><strong>Find the right words</strong><span>Turn a rough idea into a first draft</span></button>
            <button type="button" class="suggestion" data-prompt="Help me debug some code. Ask me for the code, the error, and what I expected to happen."><span class="suggestion-icon"><i data-lucide="code-2"></i></span><strong>Work through the code</strong><span>Get a fresh pair of eyes</span></button>
          </div>
        </section>
        <section class="conversation" id="conversation" aria-label="Conversation" role="log" aria-live="polite"></section>
      </div>
      <div class="composer-area">
        <div class="composer-wrap">
          <div class="error" id="error" role="alert" hidden><span id="error-text"></span><button type="button" id="retry" hidden>Retry</button></div>
          <form class="composer" id="chat-form">
            <label for="question" hidden>Your question</label>
            <textarea id="question" maxlength="12000" placeholder="Ask anything, or follow a thought..." aria-label="Your question" rows="2"></textarea>
            <div class="composer-bottom"><span class="model"><i data-lucide="box"></i><span id="model-name">OpenAI</span></span><button class="send" id="send" type="submit" title="Send message" aria-label="Send message" disabled><i data-lucide="arrow-up"></i></button></div>
          </form>
          <p class="footnote">AI can make mistakes. Double-check what matters.</p>
        </div>
      </div>
    </main>
  </div>
  <script>
    const question = document.querySelector('#question');
    const send = document.querySelector('#send');
    const conversation = document.querySelector('#conversation');
    const welcome = document.querySelector('#welcome');
    const scrollArea = document.querySelector('#scroll-area');
    const errorBox = document.querySelector('#error');
    const errorText = document.querySelector('#error-text');
    const retry = document.querySelector('#retry');
    let messages = [];
    let busy = false;
    let configured = false;
    let failedQuestion = '';

    function icons() { if (window.lucide) window.lucide.createIcons(); }
    function showError(text, canRetry = false) {
      errorText.textContent = text;
      errorBox.hidden = false;
      retry.hidden = !canRetry;
    }
    function updateSend() { send.disabled = busy || !question.value.trim() || !configured; }
    function render() {
      conversation.replaceChildren();
      welcome.hidden = messages.length > 0;
      document.querySelector('#chat-title').textContent = messages[0]?.content || 'A fresh start';
      for (const message of messages) {
        const row = document.createElement('article');
        row.className = `message ${message.role}`;
        const avatar = document.createElement('div');
        avatar.className = `avatar ${message.role}`;
        avatar.textContent = message.role === 'user' ? 'YOU' : 'R';
        const main = document.createElement('div');
        main.className = 'message-main';
        const name = document.createElement('div');
        name.className = 'message-name';
        name.textContent = message.role === 'user' ? 'You' : 'Revisio';
        const text = document.createElement('div');
        text.className = 'message-text';
        text.textContent = message.content;
        main.append(name, text);
        row.append(avatar, main);
        conversation.append(row);
      }
      if (busy) {
        const pending = document.createElement('div');
        pending.className = 'message pending';
        pending.textContent = 'Revisio is thinking...';
        pending.setAttribute('role', 'status');
        conversation.append(pending);
      }
      scrollArea.scrollTop = scrollArea.scrollHeight;
    }

    async function submit(content) {
      if (busy || !configured || !content.trim()) return;
      if (content.length > 12000) { showError('Please keep your question under 12,000 characters.'); return; }
      busy = true;
      failedQuestion = '';
      errorBox.hidden = true;
      messages.push({ role: 'user', content });
      question.value = '';
      question.style.height = '';
      question.disabled = true;
      updateSend();
      render();
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: messages.slice(-39) }),
          signal: AbortSignal.timeout(105000),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'The request failed. Please try again.');
        if (typeof data.answer !== 'string' || !data.answer.trim()) throw new Error('The reply was empty. Please try again.');
        messages.push({ role: 'assistant', content: data.answer });
      } catch (error) {
        messages.pop();
        failedQuestion = content;
        question.value = content;
        showError(error instanceof TypeError ? 'Cannot reach the server. Check your connection and try again.' : error.message, true);
      } finally {
        busy = false;
        question.disabled = false;
        updateSend();
        render();
        question.focus();
      }
    }

    document.querySelector('#chat-form').addEventListener('submit', event => { event.preventDefault(); submit(question.value.trim()); });
    question.addEventListener('input', () => {
      question.style.height = '';
      question.style.height = Math.min(question.scrollHeight, 160) + 'px';
      updateSend();
    });
    question.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing && window.matchMedia('(min-width: 641px)').matches) {
        event.preventDefault();
        submit(question.value.trim());
      }
    });
    document.querySelectorAll('.suggestion').forEach(button => button.addEventListener('click', () => {
      if (busy) return;
      question.value = button.dataset.prompt;
      updateSend();
      question.focus();
    }));
    document.querySelectorAll('.new-chat').forEach(button => button.addEventListener('click', () => {
      if (busy) return;
      messages = [];
      failedQuestion = '';
      question.value = '';
      question.style.height = '';
      errorBox.hidden = true;
      updateSend();
      render();
      question.focus();
    }));
    retry.addEventListener('click', () => submit(failedQuestion));
    async function loadConfig() {
      try {
        const response = await fetch('/api/config');
        if (!response.ok) throw new Error('Configuration request failed');
        const data = await response.json();
        configured = data.configured;
        document.querySelector('#model-name').textContent = data.model;
        document.querySelector('#status-label').textContent = configured ? 'Connected' : 'API key needed';
        document.querySelector('#status-dot').className = 'dot ' + (configured ? 'ready' : 'missing');
        if (!configured) showError('Set OPENAI_API_KEY on the server, then restart the app and refresh this page.');
      } catch {
        document.querySelector('#status-label').textContent = 'Offline';
        showError('Cannot reach the server. Refresh the page to reconnect.');
      }
      updateSend();
    }
    window.addEventListener('DOMContentLoaded', icons);
    loadConfig();
  </script>
</body>
</html>
